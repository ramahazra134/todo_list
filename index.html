
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Todo Box -->
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-lg p-5">

        <!-- Header -->
        <div class="flex justify-between items-center mb-5">

            <div>
                <h1 class="text-2xl font-bold text-slate-800">
                    My Todo
                </h1>

                <p class="text-sm text-slate-400">
                    Manage your daily tasks
                </p>
            </div>

            <span
                id="count"
                class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-sm font-semibold"
            >
                0
            </span>

        </div>


        <!-- Input -->
        <div class="flex gap-2 mb-3">

            <input
                id="taskInput"
                type="text"
                placeholder="Enter task..."
                class="flex-1 border border-slate-200 rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-blue-500"
            >

            <button
                onclick="addTask()"
                class="bg-blue-600 hover:bg-blue-700 text-white px-5 rounded-lg font-medium"
            >
                Add
            </button>

        </div>


        <!-- Date & Time -->
        <div class="grid grid-cols-2 gap-2 mb-5">

            <input
                id="taskDate"
                type="date"
                class="border border-slate-200 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 text-sm"
            >

            <input
                id="taskTime"
                type="time"
                class="border border-slate-200 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 text-sm"
            >

        </div>


        <!-- Tasks -->
        <div id="taskList" class="space-y-2">
        </div>


        <!-- Empty -->
        <p
            id="empty"
            class="text-center text-slate-400 text-sm py-6"
        >
            No tasks added yet.
        </p>

    </div>


    <script src="script.js">

       
    </script>

</body>

</html>
